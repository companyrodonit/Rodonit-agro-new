<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Фавікон «Родоніт Агро». Спрощена версія знака з app/(frontend)/logo.tsx.

    Чому дві орбіти замість чотирьох: іконка вкладки — 16x16. Перевірено
    рендером усіх варіантів у смузі вкладок: на повному знаку (4 еліпси,
    штрих 3.2) орбіти на 16px злипаються в сіру пляму і ядро зникає.
    Дві діагональні орбіти зі штрихом 7 лишають упізнаваний «атом» і на 16px,
    і на 32px. Повний знак живе в apple-icon.png — його показують від 120px,
    там деталізація читається.

    Плашка обовʼязкова: без неї бірюзові орбіти зникають на світлому тлі вкладки.
  -->
  <rect width="100" height="100" rx="22" fill="#01362E"/>
  <g transform="translate(50 50)">
    <g stroke="#86B0B7" stroke-width="7" fill="none">
      <ellipse rx="41" ry="19" transform="rotate(45)"/>
      <ellipse rx="41" ry="19" transform="rotate(-45)"/>
    </g>
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="#B94F74"/>
  </g>
</svg>
